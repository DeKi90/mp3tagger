[project]
name = "mp3tagger"
version = "0.1.0"
description = ""
authors = [
    {name = "Denis Kirchhübel",email = "denis.kirchhuebel@gmail.com"}
]
requires-python = ">=3.14,<4"
dependencies = [
    "nicegui (>=3.18.0,<4.0.0)",
    "mutagen (>=1.48.1,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]


[project.scripts]
mp3tagger = "mp3tagger.__main__:main"

[tool.poetry]
packages = [{ include = "mp3tagger", from = "src" }]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.17.1,<0.18.0)"
]
