name: MP3 Tagger
version: "0.1.0"
slug: mp3tagger
url: https://github.com/DeKi90/mp3tagger
description: Web GUI to edit the ID3 tags and cover art of audio files, with MusicBrainz lookup
arch:
  - aarch64
  - amd64
stage: experimental
startup: application
boot: auto

# Open the app from the Home Assistant sidebar (behind Home Assistant's login).
ingress: true
ingress_port: 8099
panel_icon: mdi:music-box-multiple
panel_title: MP3 Tagger
panel_admin: true

# Optional direct access. It is disabled until a host port is entered under Network, and it
# bypasses Home Assistant's login, so leave it off unless you need it.
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Web interface without Home Assistant login (leave empty to use the sidebar)

# Music lives in /media (and /share). The app has to write tags, so both are read-write.
map:
  - type: media
    read_only: false
  - type: share
    read_only: false

watchdog: http://[HOST]:[PORT:8099]/healthz

options:
  music_folders:
    - /media
  contact: ""
  cover_country: de
schema:
  music_folders:
    - str
  contact: str?
  cover_country: match(^[a-zA-Z]{2}$)
